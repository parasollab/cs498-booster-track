[project]
name = "course-tasks"
version = "0.1.0"
description = "Course environments and infrastructure for RL on DeltaAI (mjlab / MuJoCo Warp)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "mjlab",
    "torch",
]

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

# ---------------------------------------------------------------------------
# CRITICAL: this is how our tasks show up in `uv run list-envs` / `train` /
# `play`. mjlab scans the "mjlab.tasks" entry-point group at import time and
# imports each listed package; importing `course_tasks` triggers our
# register_mjlab_task() calls. If a student's task is "missing", the first
# things to check are (1) this table, (2) that the hw module is imported in
# src/course_tasks/__init__.py.
# ---------------------------------------------------------------------------
[project.entry-points."mjlab.tasks"]
course_tasks = "course_tasks"

# ---------------------------------------------------------------------------
# Package sources. Modeled on mujocolab/mjlab_playground. Two deliberate
# course-side choices:
#   * mjlab is pinned to a specific commit so the API the handouts describe
#     is the API students get. Bump the rev intentionally, per-semester.
#   * torch comes from PyPI's default resolution: on DeltaAI (aarch64 /
#     Grace Hopper) a plain `uv sync` was verified to resolve an
#     aarch64+CUDA build (torch 2.14.0+cu130, the version uv.lock pins). Do
#     NOT copy the x86-only pytorch-cu128 index from mjlab_playground here;
#     it would break aarch64.
#     After the first successful sync ON DELTAAI, commit uv.lock so every
#     student resolves the identical environment.
# ---------------------------------------------------------------------------
[tool.uv.sources]
mjlab = { git = "https://github.com/mujocolab/mjlab", rev = "8ee51fbcf806a7419189f706d9e394cbeb7790fa" }
warp-lang = { index = "nvidia", marker = "sys_platform != 'darwin'" }

[[tool.uv.index]]
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[tool.ruff]
indent-width = 2
src = ["src/course_tasks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
